services:
  mongo:
    image: mongo:7
    container_name: gov-agent-demo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent-api:
    build: .
    container_name: gov-agent-demo-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-政务 API 安全运营 Agent Demo}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-gov_api_agent_demo}
      MONGODB_COLLECTION: ${MONGODB_COLLECTION:-agent_runs}
      MILVUS_URI: /workspace/runtime/milvus/rag.db
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-gov_api_knowledge}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.25}
    ports:
      - "8000:8000"
    volumes:
      - milvus_data:/workspace/runtime/milvus
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  milvus_data:
